<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ロボットを召喚</title>
  <link rel="stylesheet" href="lab.css?v=3">

  <script defer src="vendor/aframe.min.js"></script>
  <script defer src="robot.js?v=3"></script>
  <script defer src="play.js?v=3"></script>
</head>

<body class="app">
  <header class="topbar">
    <a href="index.html" data-exit aria-label="ホームへ戻る">← 戻る</a>
    <h1>ロボットを召喚</h1>
    <p id="status" role="status"></p>
  </header>
  <div id="stage"></div>
  <section id="start-panel" class="start-panel">

    <p>マーカーの黒い枠を全部映してください。</p>
    <button id="start" class="primary">背面カメラを起動</button>
    <a class="text-link" href="marker.html" target="_blank" rel="noopener">マーカーを表示</a>
    <button id="preview">カメラなしで試す</button>
    <p id="error" role="alert"></p>
  </section>

  <section id="controls" class="dock gamepad" aria-label="ロボットの操作" hidden>
    <div class="dpad">
      <button data-dir="up" aria-label="奥へ移動">↑</button>
      <button data-dir="left" aria-label="左へ移動">←</button>
      <button data-dir="down" aria-label="手前へ移動">↓</button>
      <button data-dir="right" aria-label="右へ移動">→</button>
    </div>
    <button id="jump" class="primary">ジャンプ</button>
  </section>
</body>
</html>
