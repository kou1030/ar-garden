<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>ロボットに変身</title>
  <link rel="stylesheet" href="lab.css?v=4">

  <script defer src="vendor/aframe.min.js"></script>
  <script defer src="robot.js?v=4"></script>
  <script defer src="face.js?v=4"></script>
</head>

<body class="app">
  <header class="topbar">
    <a href="index.html" data-exit aria-label="ホームへ戻る">← 戻る</a>
    <h1>ロボットに変身</h1>
    <p id="status" role="status"></p>
  </header>
  <div id="stage"></div>
  <section id="start-panel" class="start-panel">

    <p>口を開けると装甲が開きます。</p>
    <button id="start" class="primary">内カメラを起動</button>
    <button id="preview">カメラなしで試す</button>
    <p id="error" role="alert"></p>
  </section>

  <section id="controls" class="dock" aria-label="装甲プレビュー" hidden>
    <button id="demo-open" class="primary" aria-pressed="false">装甲を開く</button>
  </section>
</body>
</html>
