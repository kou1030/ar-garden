<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ロボットに変身 | ポケット・ロボラボ</title><link rel="stylesheet" href="lab.css"><script defer src="vendor/aframe.min.js"></script><script defer src="robot.js"></script><script defer src="face.js"></script></head><body class="app"><header class="topbar"><a href="index.html" data-exit>← ロボラボ</a><h1>ロボットに変身</h1><div id="status" class="status" role="status">口を開けて、コアを解放しよう</div></header><div id="stage"></div><section id="start-panel" class="start-panel"><span class="kicker">FACE / SELFIE CAMERA</span><h2>中のキミが、目を覚ます。</h2><p>顔にロボットの装甲を装着。<br>口を開けると左右の装甲が展開し、<br>中の発光コアとギアが見えます。</p><button id="start" class="primary">内カメで変身する</button><button id="preview">装甲の動きをプレビュー</button><p class="tiny">初回は顔認識モデルの読み込みに時間がかかります。顔画像は保存・送信しません。</p><p id="error" role="alert"></p></section><div id="tracking-hint" hidden><div class="scan-frame"></div>顔を正面に向けてください</div><section id="controls" class="dock face-dock" hidden><div class="dock-head"><span id="mode-label">FACE ARMOR / STANDBY</span><span id="mouth-label">口の開き 0%</span></div><div class="meter" aria-hidden="true"><i id="mouth-meter"></i></div><div class="swatches" aria-label="コアの色"><button data-color="mint" aria-pressed="true">ミント</button><button data-color="amber" aria-pressed="false">アンバー</button><button data-color="violet" aria-pressed="false">バイオレット</button></div><label class="slider-row">反応感度 <input id="sensitivity" aria-label="口の反応感度" type="range" min="0.6" max="2" step="0.1" value="1.2"></label><button id="demo-open" class="primary" style="width:100%;margin-top:10px" hidden aria-pressed="false">装甲を開く</button><p id="hint" class="hint">口をゆっくり開けると展開。閉じると元に戻ります。</p><a class="home-return" href="play.html" data-exit>マーカーでロボットを操作 →</a></section></body></html>
